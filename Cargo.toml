# coinpoker-help — workspace root
#
# A modular decision-support framework for stochastic gaming environments,
# structured for academic study. See README.md for the architecture overview.

[workspace]
resolver = "2"
members = [
    "crates/ingest",
    "crates/core-engine",
    "crates/ghost-layer",
    "crates/opponent-model",
    "crates/ui",
    "bin",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.95"
authors = ["coinpoker-help contributors"]
description = "A modular decision-support framework for stochastic gaming environments"

# Shared dependency versions. Crates opt in by referencing these keys as
# `dep = { workspace = true }`. macOS-only dependencies are declared per-crate
# under `[target.'cfg(target_os = "macos")'.dependencies]`.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` makes f64 parsing exact (serde_json's fast parser can be
# 1 ULP off on long literals); GameState carries an optional f64 confidence.
serde_json = { version = "1", features = ["float_roundtrip"] }
url = "2"
thiserror = "2"
rand = "0.8"
rand_distr = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# NOTE: pinned to 4.1 with `arena` disabled — the `arena` feature requires a
# nightly compiler (`#![feature(assert_matches)]`), and 5.x requires Rust 1.97+.
rs_poker = { version = "4.1", default-features = false, features = ["serde"] }
egui = "0.36"
eframe = "0.36"
# Dev dependencies for property and snapshot testing (opt-in per crate)
proptest = { version = "1.0", features = ["std"] }
insta = { version = "1.34", features = ["json"] }


[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 1

[workspace.metadata]
# Coverage command (default features only; desktop feature has no tests)
# Run locally: cargo llvm-cov --workspace --all-targets --locked
# CI enforces a minimum line-coverage floor via --fail-under-lines
coverage-command = "cargo llvm-cov --workspace --all-targets --locked"
