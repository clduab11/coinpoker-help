name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install lightweight Python test dependencies
        run: python -B -m pip install --requirement scripts/requirements-test.txt
      - name: Install pinned Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo +1.95.0 fmt --all -- --check
      - name: Check
        run: cargo +1.95.0 check --workspace --all-targets --all-features --locked
      - name: Test
        run: cargo +1.95.0 test --workspace --all-targets --all-features --locked
      - name: Clippy
        run: cargo +1.95.0 clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Doc tests
        run: cargo +1.95.0 test --doc --workspace --all-features --locked
      - name: Python diagnostics
        run: python -B -m unittest discover -s scripts/tests -v
      - name: Workflow YAML validation
        run: python -B -c "from pathlib import Path; from scripts.validate import validate_workflow_workflows; code, output = validate_workflow_workflows(Path.cwd()); print(output); raise SystemExit(code)"
      - name: Synthetic evaluation
        run: cargo +1.95.0 run --locked --bin coinpoker -- --evaluate fixtures/synthetic/manifest.json
      - name: PowerShell script syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $paths = @((Resolve-Path 'download-model.ps1').Path) + @(Get-ChildItem scripts -Filter '*.ps1' -File | ForEach-Object FullName)
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "PowerShell syntax errors in $path`: $($errors -join '; ')" }
          }

  coverage:
    name: Coverage (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage-${{ hashFiles('**/Cargo.lock') }}
      - name: Install pinned Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component llvm-tools-preview
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Run coverage
        run: cargo +1.95.0 llvm-cov --workspace --all-targets --locked --fail-under-lines 80

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run audit
        run: cargo audit --locked

  shell-syntax:
    name: Shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate downloader syntax
        shell: bash
        run: bash -n download-model.sh
      - name: Run shellcheck
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck download-model.sh
          else
            echo "shellcheck not installed, skipping (bash -n passed)"
          fi
