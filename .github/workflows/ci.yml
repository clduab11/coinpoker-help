name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo +stable fmt --all -- --check
      - name: Check
        run: cargo +stable check --workspace --all-targets --all-features --locked
      - name: Test
        run: cargo +stable test --workspace --all-targets --all-features --locked
      - name: Clippy
        run: cargo +stable clippy --workspace --all-targets --all-features --locked -- -D warnings

  msrv:
    name: MSRV 1.95.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MSRV
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy
      - name: Check at MSRV
        run: cargo +1.95.0 check --workspace --all-targets --all-features --locked
      - name: Test at MSRV
        run: cargo +1.95.0 test --workspace --all-targets --all-features --locked
      - name: Strict clippy at MSRV
        run: cargo +1.95.0 clippy --workspace --all-targets --all-features --locked -- -D warnings

  shell-syntax:
    name: Shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate downloader syntax
        shell: bash
        run: bash -n download-model.sh
