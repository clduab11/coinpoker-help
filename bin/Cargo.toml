[package]
name = "coinpoker"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "coinpoker-help binary: wires ingestion, decision, mimicry, modeling, and UI"
publish = false

[[bin]]
name = "coinpoker"
path = "main.rs"

[features]
default = ["desktop"]
# Native transparent study overlay (`--ui`).
desktop = ["dep:egui", "dep:eframe"]
# Loopback WebSocket mirror of overlay events (used with `--ui`).
ws = []

[dependencies]
ingest = { path = "../crates/ingest" }
core-engine = { path = "../crates/core-engine" }
rand = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
image = { workspace = true }
url = { workspace = true }
egui = { workspace = true, optional = true }
eframe = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3.27"
insta = { workspace = true }

[[test]]
name = "ws"
path = "tests/ws.rs"
required-features = ["ws"]
